# Generate the Xcode project with:  xcodegen generate
# The .xcodeproj is build output and is gitignored; this file is the source of truth.
name: OldTunes
options:
  bundleIdPrefix: com.noahtsutsui
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  # Writes OldTunes-Debug.entitlements (not committed): OldTunes.entitlements plus what only Debug
  # builds get, for the test benches; the script says what and why.
  postGenCommand: tools/debug-entitlements.sh
# Debug and Bench builds carry the test benches (OLDTUNES_HARNESS, docs/DEVELOPMENT.md ▸ Test
# benches); Release, the build that ships, leaves them out. Bench is Release plus the benches: the
# same optimizer and entitlements as what ships, for checks that must run on a release build.
configs:
  Debug: debug
  Bench: release
  Release: release
# Changing a version here changes what the About box must credit: docs/LICENSES.md says what to
# update.
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1
  SFBAudioEngine:
    url: https://github.com/sbooth/SFBAudioEngine
    exactVersion: 0.14.0
  # Monkey's Audio, which SFBAudioEngine pulls in, built from Vendor/ instead of GitHub: a local
  # package replaces the remote one of the same name. Its only change is an MD5.cpp under RSA's
  # permissive licence in place of a GPL one; Vendor/README.md says why and when to remove it.
  CXXMonkeysAudio:
    path: Vendor/CXXMonkeysAudio
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 92N52YB23U
    CODE_SIGN_STYLE: Automatic
    # The version people see. Releases set the build number to main's commit count
    # (tools/release.sh); everyday builds stay at 1.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
targets:
  OldTunes:
    type: application
    platform: macOS
    sources:
      - path: OldTunes
        excludes:
          - App/Licenses
      # Geiss HDR's licence and NOTICE travel inside the app, as Apache-2.0 §4(a) and (d) ask.
      - path: VisualizerCore/LICENSE.txt
        buildPhase: resources
      - path: VisualizerCore/NOTICE.txt
        buildPhase: resources
      # Every other library's licence, as one folder: Contents/Resources/Licenses. Credits.html
      # names each file; docs/LICENSES.md says where each came from.
      - path: OldTunes/App/Licenses
        type: folder
        buildPhase: resources
    dependencies:
      - package: GRDB
        product: GRDB
      - package: SFBAudioEngine
        product: SFBAudioEngine
      - sdk: iTunesLibrary.framework
      - sdk: MusicKit.framework
      - sdk: ScriptingBridge.framework
      - target: VisualizerCore
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: Accelerate.framework
    info:
      path: OldTunes/App/Info.plist
      properties:
        CFBundleDisplayName: OldTunes
        CFBundleName: OldTunes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSAppleMusicUsageDescription: OldTunes reads your music library so it can list, search and play your songs, including the ones stored in iCloud.
        NSAppleEventsUsageDescription: OldTunes asks Music to save tag changes to songs in your Music library, to add songs to Music when you turn on “Also add to the Music app”, to make, rename and delete the playlists you change in OldTunes and add or remove songs in them, and to download iCloud songs to this Mac.
        NSAudioCaptureUsageDescription: OldTunes takes the sound of the iCloud songs it plays from Apple's player, so its volume and Sound Check can set their level, and so a visualizer can move with the music.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noahtsutsui.oldtunes
        PRODUCT_NAME: OldTunes
        # The App Sandbox and what OldTunes needs inside it; the file says why for each key.
        # Hand-written rather than an `entitlements:` block, which XcodeGen would set for every
        # configuration, and Debug needs its own.
        CODE_SIGN_ENTITLEMENTS: OldTunes/App/OldTunes.entitlements
      configs:
        # The same entitlements plus the test benches' extras (tools/debug-entitlements.sh). Music
        # scripting must also be checked on a Bench build, which reaches less of Music.
        Debug:
          CODE_SIGN_ENTITLEMENTS: OldTunes/App/OldTunes-Debug.entitlements
          # Compiles the benches' launch code in (LaunchEnvironment, AppDelegate).
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) BENCHES"
        Bench:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) BENCHES"
        # The test benches' files, left out of the build that ships. A new bench's file must match
        # one of these names, or it ships too; tools/release.sh refuses a build that has one.
        Release:
          EXCLUDED_SOURCE_FILE_NAMES:
            - "*Harness*.swift"
            - "*Bench*.swift"
            - "*LiveTest.swift"
            - "VisualizerFixtures*.swift"
            - SmokeTest.swift
            - AuthCheck.swift
            - MusicAccessProbe.swift
            - AudioProcessProbe.swift
            - CloudEndProbe.swift
            - StressLibrary.swift
            - Snapshot.swift
  # The visualizer: Geiss HDR's engine and shaders ported to Swift and Metal, plus the audio
  # analysis that feeds it (docs/VISUALIZER.md). Its own target so it is optimized in every
  # configuration: the engine is numeric Swift, and at -Onone one warp map takes seconds.
  VisualizerCore:
    type: library.static
    platform: macOS
    sources:
      - path: VisualizerCore
        excludes:
          - "*.txt"
          - "*.md"
    settings:
      base:
        PRODUCT_NAME: VisualizerCore
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        SWIFT_COMPILATION_MODE: wholemodule
        ENABLE_TESTABILITY: NO
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
